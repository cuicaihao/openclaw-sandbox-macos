services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    user: "${OPENCLAW_UID:-501}:${OPENCLAW_GID:-20}"
    restart: unless-stopped
    ports:
      - "3000:18789"
    environment:
      - HOME=/home/node
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama}
      - OPENCLAW_PROVIDERS_OLLAMA_NUM_CTX=4096
      - OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY=batiai/gemma4-e4b:q4
      - OPENCLAW_PROVIDERS_OLLAMA_MODEL=batiai/gemma4-e4b:q4
      - OPENCLAW_AGENTS_DEFAULTS_THINKING=low
    volumes:
      - ./sandbox:/home/node/.openclaw/workspace
      - ./config:/home/node/.openclaw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    pids_limit: 128
    mem_limit: 4g
    cpus: 4
    init: true
    shm_size: '2gb'
    networks:
      - internal

networks:
  internal:
    driver: bridge
