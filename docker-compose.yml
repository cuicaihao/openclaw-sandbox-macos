services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    user: "${OPENCLAW_UID:-501}:${OPENCLAW_GID:-20}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:18789"
    environment:
      - HOME=/home/node
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OPENCLAW_PROVIDERS_OLLAMA_NUM_CTX=16384
      - OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY=ollama/qwen3.5:0.8b
      - OPENCLAW_PROVIDERS_OLLAMA_MODEL=ollama/qwen3.5:0.8b
      - OPENCLAW_GATEWAY_CONTROL_UI_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./sandbox:/home/node/.openclaw/workspace
      - ./config:/home/node/.openclaw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    pids_limit: 64
    mem_limit: 3g
    cpus: 2
    init: true
    shm_size: '2gb'
    networks:
      - internal

networks:
  internal:
    driver: bridge
